name: Recover article body images

on:
  push:
    paths:
      - .github/workflows/recover-body-images.yml
      - scripts/recover-body-images.mjs

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover images from public shares
        run: node scripts/recover-body-images.mjs
      - name: Commit recovered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cms/body
          git commit -m "Recover article body images"
          git push
